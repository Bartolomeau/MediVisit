<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head th:replace="~{fragments :: head('Logowanie')}"></head>
<body class="auth-page">

<div class="auth-card">
    <img th:src="@{/logo.svg}" alt="MediVisit" class="auth-logo">
    <p class="subtitle">System rejestracji wizyt w przychodni</p>
    <h1>Logowanie</h1>

    <div th:replace="~{fragments :: flash}"></div>

    <form method="post" th:action="@{/login}">
        <label for="email">Adres e-mail</label>
        <input type="email" id="email" name="email" th:value="${email}" required autofocus>

        <label for="password">Hasło</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-primary btn-block">Zaloguj się</button>
    </form>

    <a th:href="@{/register}" class="link-center">Nie masz konta? Zarejestruj się</a>

    <p class="demo-hint">
        Konta demonstracyjne:<br>
        admin@medivisit.pl / Admin123! &nbsp;•&nbsp;
        j.kowalski@medivisit.pl / Lekarz123! &nbsp;•&nbsp;
        pacjent@medivisit.pl / Pacjent123!
    </p>
</div>

</body>
</html>
