<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head th:replace="~{fragments :: head('Rejestracja')}"></head>
<body class="auth-page">

<div class="auth-card">
    <img th:src="@{/logo.svg}" alt="MediVisit" class="auth-logo">
    <h1>Rejestracja pacjenta</h1>

    <div th:replace="~{fragments :: flash}"></div>

    <form method="post" th:action="@{/register}">
        <div class="form-row">
            <div>
                <label for="firstName">Imię</label>
                <input type="text" id="firstName" name="firstName" th:value="${firstName}" required>
            </div>
            <div>
                <label for="lastName">Nazwisko</label>
                <input type="text" id="lastName" name="lastName" th:value="${lastName}" required>
            </div>
        </div>

        <label for="email">Adres e-mail</label>
        <input type="email" id="email" name="email" th:value="${email}" required>

        <label for="phone">Telefon (9 cyfr)</label>
        <input type="tel" id="phone" name="phone" th:value="${phone}" pattern="[0-9]{9}" required>

        <label for="password">Hasło (min. 8 znaków, litera i cyfra)</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <label for="confirm">Powtórz hasło</label>
        <input type="password" id="confirm" name="confirm" minlength="8" required>

        <button type="submit" class="btn btn-accent btn-block">Załóż konto</button>
    </form>

    <a th:href="@{/login}" class="link-center">Masz już konto? Zaloguj się</a>
</div>

</body>
</html>
